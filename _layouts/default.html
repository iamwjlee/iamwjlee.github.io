<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    /* 표 테두리가 항상 보이도록 기본 스타일 보장 */
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
    }
    .markdown-body th,
    .markdown-body td {
      border: 1px solid #d0d7de;
      padding: 8px 12px;
    }
    .markdown-body th {
      background-color: #f6f8fa;
      font-weight: 600;
    }
    @media (max-width: 767px) {
      .markdown-body { padding: 15px; }
    }
  </style>
</head>
<body>
  <main class="markdown-body">
    {{ content }}
  </main>

  <script type="module">
    import mermaid from 'https://jsdelivr.net';

    // Jekyll(div.language-mermaid) 및 일반(code.language-mermaid) 모두 처리
    document.querySelectorAll('.language-mermaid').forEach((el) => {
      const target = el.closest('div.highlighter-rouge') || el.closest('pre') || el;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent.trim();
      target.replaceWith(div);
    });

    mermaid.initialize({ startOnLoad: false });
    await mermaid.run();
  </script>
</body>
</html>
